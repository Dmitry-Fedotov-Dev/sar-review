apiVersion: 1
datasources:
  - name: Prometheus
    # uid задан ЯВНО и не должен меняться: на него по имени ссылается каждая
    # панель дашборда. Без явного uid Grafana генерирует свой при каждой
    # установке (у нас был PBFA97CFB590B2093), а дашборд, разложенный файлом,
    # ссылался на переменную-датасорс -- та не разрешалась в реальный uid, и
    # панели молча оставались без данных.
    uid: sar-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
