# Copy to .github/workflows/deploy.yml.
# Repository settings → Secrets and variables → Actions → Variables: CD_SERVER = https://deploy.example.com
# The server owner allows the project once: cdctl project add <name> --repo <owner>/<repo>
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [deploy, status, logs, rollback]
        default: deploy

permissions:
  contents: read
  id-token: write # the OIDC token is the only credential

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # tests, lint, build checks go here — the server builds the release itself
      # SAR Review: весь набор тестов. Красный -- на сервер не уходит ничего.
      # status/logs/rollback код не трогают -- им тесты не нужны.
      - uses: actions/setup-python@v5
        if: ${{ (inputs.action || 'deploy') == 'deploy' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: ffmpeg
        if: ${{ (inputs.action || 'deploy') == 'deploy' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - if: ${{ (inputs.action || 'deploy') == 'deploy' }}
        run: pip install -r requirements-dev.txt
      - if: ${{ (inputs.action || 'deploy') == 'deploy' }}
        run: python -m pytest -q
      - uses: Dmitry-Fedotov-Dev/cd@v1
        with:
          server: ${{ vars.CD_SERVER }}
          project: sar
          action: ${{ inputs.action || 'deploy' }}
