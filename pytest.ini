[pytest]
testpaths = tests

# Хранить одну сессию временных папок вместо трёх.
#
# Тесты временной папки скачивания пишут НАСТОЯЩИЕ файлы по десяткам
# мегабайт (иначе они не проверяли бы вытеснение по размеру). При трёх
# сессиях набегает около двух гигабайт, и 17.09.2026 это переполнило C:
# до нуля -- прогон рассыпался с «database or disk is full», хотя ни одна
# проверяемая строка не менялась.
tmp_path_retention_count = 1

